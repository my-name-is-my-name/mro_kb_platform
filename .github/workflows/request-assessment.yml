name: request-assessment

on:
  push:
    branches:
      - experiment/mro-similar-cases-structured-profiles
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall apps core storage tests
      - name: Request assessment tests
        run: python -m unittest tests.test_request_assessment_workflow tests.test_request_assessment_contract_guards
      - name: Full test suite
        run: python -m unittest

